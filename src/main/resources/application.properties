spring.application.name=facturacion-services
spring.datasource.url=${FACTURACION_DB_URL:jdbc:h2:file:./data/facturacion}
spring.datasource.username=${FACTURACION_DB_USER:sa}
spring.datasource.password=${FACTURACION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# Independent switches: demonstration data versus outbound request adapter.
facturacion.mock-datos=${FACTURACION_MOCK_DATOS:true}
facturacion.proveedor=${FACTURACION_PROVEEDOR:siat}
# Only simulated transport is implemented; "real" fails at startup.
facturacion.transporte=${FACTURACION_TRANSPORTE:simulado}
facturacion.simulacion.escenario=${FACTURACION_ESCENARIO:aceptar}
facturacion.emisor.nit=${FACTURACION_EMISOR_NIT:123456789}
facturacion.emisor.razon-social=${FACTURACION_EMISOR_RAZON_SOCIAL:EMPRESA DEMOSTRACION}
facturacion.emisor.municipio=${FACTURACION_EMISOR_MUNICIPIO:La Paz}
facturacion.emisor.direccion=${FACTURACION_EMISOR_DIRECCION:Direccion de prueba}
facturacion.emisor.sucursal=${FACTURACION_EMISOR_SUCURSAL:0}
facturacion.emisor.punto-venta=${FACTURACION_EMISOR_PUNTO_VENTA:0}
